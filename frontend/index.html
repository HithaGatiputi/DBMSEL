<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Incident Investigation Console</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap">
<link rel="stylesheet" href="/static/style.css?v=13">
</head><body>

<div id="login" class="login" hidden>
  <form id="loginForm" class="card loginCard" novalidate>
    <div class="brand big"><span class="logo">&#9919;</span> Cyber Incident Investigation</div>
    <p class="mut">Sign in as a Security Analyst or System Administrator.</p>
    <label>Username<input id="lu" autocomplete="username" required minlength="3" maxlength="50" placeholder="analyst.rao"></label>
    <label>Password<input id="lp" type="password" autocomplete="current-password" required maxlength="128"></label>
    <div id="lerr" class="err"></div>
    <button class="btn wide" type="submit">Sign in</button>
    <p class="mut small">Demo accounts: <code>analyst.rao</code>, <code>analyst.menon</code>, <code>analyst.das</code> (Analyst) ·
      <code>admin.iyer</code>, <code>admin.singh</code> (Admin). Password: <code>Rvce@2026</code></p>
  </form>
</div>

<div id="app" hidden>
<aside class="side">
  <div class="brand"><span class="logo">&#9670;</span> Incident <br>Investigation</div>
  <nav id="nav" aria-label="Main">
    <div class="grp">Investigate</div>
    <button data-tab="overview" class="on">Dashboard</button>
    <button data-tab="incidents">Incidents</button>
    <button data-tab="alerts">Alerts</button>
    <button data-tab="events">Events &amp; logs</button>
    <div class="grp">Tools</div>
    <button data-tab="ask">Ask AI</button>
    <button data-tab="reports">Reports</button>
    <button data-tab="audit">Audit trail</button>
    <div class="grp adminOnly">Manage</div>
    <button data-tab="admin" class="adminOnly">Admin</button>
    <div class="grp">Help</div>
    <button data-tab="guide">How to use</button>
    <button data-tab="design">Project design</button>
  </nav>
  <div class="sidefoot" id="health"></div>
</aside>
<div class="maincol">
<header class="top">
  <div><h1 id="ptitle">Dashboard</h1><p id="psub" class="mut"></p></div>
  <div class="who"><span id="whoami"></span><button class="btn sec sm" id="logout">Sign out</button></div>
</header>
<main>
  <section id="tab-overview"></section>
  <section id="tab-incidents" hidden></section>
  <section id="tab-alerts" hidden></section>
  <section id="tab-events" hidden></section>
  <section id="tab-ask" hidden></section>
  <section id="tab-reports" hidden></section>
  <section id="tab-logs" hidden></section>
  <section id="tab-audit" hidden></section>
  <section id="tab-admin" hidden></section>
  <section id="tab-design" hidden></section>
  <section id="tab-guide" hidden></section>
</main>
</div>
</div>
<div id="modal" class="modal" hidden><div class="card modalCard"><span class="close" id="mclose">&times;</span><div id="mbody"></div></div></div>
<div id="toast" role="status"></div>
<script src="/static/app.js?v=13"></script>
</body></html>
